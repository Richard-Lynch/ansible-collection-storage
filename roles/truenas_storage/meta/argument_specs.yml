#
# Source of truth: roles/truenas_storage/meta/argument_specs.py
# Regenerate:      venv/bin/python tools/argspec/cli.py x generate truenas_storage
#
# Edits here are silently overwritten on the next generation. To change a value or its
# documentation, change the OptionSpec in the source file above — descriptions there
# are emitted as the comments in this file.
argument_specs:
  main:
    short_description: Reconcile TrueNAS zvol sizes and datasets via the API
    description:
      - Grows zvols and creates datasets on a TrueNAS appliance through its REST API, so storage layout is declared in the repo rather than clicked in the UI or typed as ad-hoc `zfs` over SSH.
      - "GROW-ONLY for zvols by design: ZFS cannot shrink a zvol, and a volsize below the consumer filesystem's size destroys data. The role refuses to shrink rather than trusting the caller to have got it right."
      - Defaults to generate-don't-apply — reports the diff and changes nothing until truenas_storage_apply is true.
    version_added: '1.0'
    author: Collection maintainers
    options:
      truenas_storage_api_host:
        description:
          - Address of the TrueNAS appliance.
        type: str
        required: true
      truenas_storage_api_user:
        description:
          - API user. The default is the administrative account TrueNAS SCALE creates at install.
        type: str
        required: false
        default: truenas_admin
      truenas_storage_api_password:
        description:
          - API password (resolve it from a secret store; an empty value is rejected).
        type: str
        required: true
        no_log: true
      truenas_storage_validate_certs:
        description:
          - TrueNAS presents a self-signed certificate by default.
        type: bool
        required: false
        default: false
      truenas_storage_zvols:
        description:
          - Zvols to reconcile. Only `volsize` is managed, and only upwards.
        type: list
        required: false
        default: []
        elements: dict
        options:
          name:
            description:
              - Full zvol path, e.g. pool1/media.
            type: str
            required: true
          volsize_gb:
            description:
              - Desired size in GiB. Must be greater than or equal to the current size — shrinking is refused.
            type: int
            required: true
      truenas_storage_datasets:
        description:
          - Filesystem datasets to create if absent.
        type: list
        required: false
        default: []
        elements: dict
        options:
          name:
            description:
              - Full dataset path, e.g. tank/backups.
            type: str
            required: true
          comments:
            description:
              - Free-text description stored on the dataset.
            type: str
            required: false
          quota_gb:
            description:
              - Optional quota in GiB. Omit for no quota.
            type: int
            required: false
          compression:
            description:
              - Compression algorithm. LZ4 is near-free and near-always right.
            type: str
            required: false
            default: lz4
          atime:
            description:
              - 'Access-time updates: DISABLED or ENABLED. Deliberately NOT off/on — bare off/on/OFF/ON are YAML 1.1 booleans, so the generated defaults file trips yaml[truthy] and the value reaches the API as a bool rather than the string TrueNAS wants. Mapped to OFF/ON at use.'
            type: str
            required: false
            default: DISABLED
      truenas_storage_destroy:
        description:
          - Datasets or zvols to DESTROY, recursively (snapshots included). Irreversible.
          - 'Every entry must carry `confirm: yes` AND the exact `expect_used_gb` the role reads back from the appliance, so a typo or a stale plan cannot delete the wrong thing or a thing that has since changed.'
          - The role additionally refuses if the target is referenced by an iSCSI extent, an NFS or SMB share, or a replication task, or if it has been written to since its last snapshot.
        type: list
        required: false
        default: []
        elements: dict
        options:
          name:
            description:
              - Full path of the dataset/zvol to destroy.
            type: str
            required: true
          confirm:
            description:
              - Must be the literal string 'yes'. Anything else refuses.
            type: str
            required: true
          expect_used_gb:
            description:
              - The size you believe this holds, in GiB. The role compares it against the appliance (5% tolerance) and refuses on a mismatch — a cheap guard against acting on a stale or mistaken plan.
            type: int
            required: true
      truenas_storage_pool_ceiling:
        description:
          - Refuse to grow a zvol if its pool is already fuller than this percentage. ZFS performance degrades sharply past ~80% and a full pool is very hard to recover from.
        type: int
        required: false
        default: 80
      truenas_storage_apply:
        description:
          - When false (default) the role reports the computed diff and changes nothing.
          - Set true to actually resize/create. Storage changes are hard to undo — run once with false and read the diff first.
        type: bool
        required: false
        default: false
