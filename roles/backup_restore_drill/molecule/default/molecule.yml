# Offline test: stub a "restored" tree on disk and exercise the artifact-verification assert logic
# (the heart of the drill) without contacting restic/B2 or a storage appliance.
---
dependency: { name: galaxy }
driver: { name: default }
platforms: [{ name: localhost }]
provisioner:
  name: ansible
  inventory: { host_vars: { localhost: { ansible_connection: local } } }
  playbooks: { converge: converge.yml, verify: verify.yml }
verifier: { name: ansible }
