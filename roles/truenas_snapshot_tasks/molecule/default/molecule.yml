# Offline test: drive the reconcile logic with a stubbed "existing tasks" list and assert the role
# only creates the missing ones (idempotency) — never contacts a real TrueNAS appliance.
---
dependency: { name: galaxy }
driver: { name: default }
platforms: [{ name: localhost }]
provisioner:
  name: ansible
  inventory: { host_vars: { localhost: { ansible_connection: local } } }
  playbooks: { converge: converge.yml, verify: verify.yml }
verifier: { name: ansible }
