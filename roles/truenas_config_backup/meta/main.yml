---
galaxy_info:
  role_name: truenas_config_backup
  namespace: richard_lynch
  author: Richard Lynch
  description: >-
    Export the TrueNAS config DB (/data/freenas-v1.db) via the native config.save middleware
    method and fetch the verified artefact to the controller. Protects the single highest-value,
    lowest-cost artefact on the appliance — deliberately does NOT back up the ZFS pool data itself
    (protect that with snapshots and replication).
  license: GPL-3.0-or-later
  min_ansible_version: "2.15"
  galaxy_tags:
    - truenas
    - backup
    - config
dependencies: []
