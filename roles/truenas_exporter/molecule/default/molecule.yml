# Offline test of the role's input gates: the argspec refuses a call with no appliance URL, the
# URL gate refuses a non-https value, and a dry run (truenas_exporter_apply false) with valid
# inputs reports and deploys nothing. No appliance, no systemd.
---
dependency: { name: galaxy }
driver: { name: default }
platforms: [{ name: localhost }]
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory: { host_vars: { localhost: { ansible_connection: local } } }
  playbooks: { converge: converge.yml, verify: verify.yml }
verifier: { name: ansible }
scenario:
  # No idempotence step: converge records which calls FAILED, which is not a state to converge.
  test_sequence: [syntax, converge, verify]
